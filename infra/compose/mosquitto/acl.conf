# FoxSay broker ACL — 生产参考
#
# local 环境按 ADR-008 不启用鉴权与 ACL（mosquitto.conf 中 allow_anonymous true）。
# 此文件在 local 下被加载但因 allow_anonymous + 无 password_file，所有匿名客户端
# 命中 `topic` 全通配，等同于不限制。生产部署改为强制凭据后，下面规则才生效。
#
# 设备 {id} 只能访问自身 topic：
#   pattern foxsay/v1/devices/%c/presence
#   pattern foxsay/v1/devices/%c/events
#   pattern foxsay/v1/devices/%c/commands
#   pattern foxsay/v1/devices/%c/acks
# 其中 %c = 客户端 username（生产中为设备 id / 证书 CN）。
#
# 后端 bridge 客户端拥有订阅所有设备 topic 的权限：
#   topic read foxsay/v1/devices/+/presence
#   topic read foxsay/v1/devices/+/events
#   topic write foxsay/v1/devices/+/commands
#   topic readwrite foxsay/v1/devices/+/acks
