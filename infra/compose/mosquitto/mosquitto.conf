# FoxSay local broker 配置（ADR-008：MVP 无鉴权）
# 生产部署必须替换为：per_device 凭据 + ACL + TLS。

# 允许匿名连接
allow_anonymous true

# MQTT TCP（设备 / mock_device / 后端 bridge 都走这里）
listener 1883 0.0.0.0

# WebSocket，便于网页端调试和 mosquitto_sub
listener 9001 0.0.0.0
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# local 不加载 ACL（ADR-008：allow_anonymous + 无 acl_file = 全开放）。
# 生产部署取消注释下一行启用 ACL，并去掉 allow_anonymous / 改为凭据：
# acl_file /mosquitto/config/acl.conf
