# FoxSay local 基础设施栈（ADR-008：无鉴权）
#
# 默认起 PostgreSQL + Mosquitto(匿名) + MinIO：
#   docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env up -d
# 后端开发时用 uv 热重载，不进 compose：
#   uv run uvicorn app.main:app --reload
# 一键起全栈（含 backend 容器）：
#   docker compose -f infra/compose/docker-compose.yml --profile full up -d --build

services:
  postgres:
    image: postgres:16.4-alpine3.20
    container_name: foxsay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foxsay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foxsay_dev}
      POSTGRES_DB: ${POSTGRES_DB:-foxsay}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foxsay}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: foxsay-mosquitto
    ports:
      - "1883:1883"
      - "9002:9001"   # WebSocket；9001 留给 MinIO console
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: foxsay-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-foxsay}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-foxsay_dev_password}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 可选：一键起全栈。开发时一般用 uv 跑后端，不启用此 service。
  backend:
    profiles: ["full"]
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: foxsay-backend
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-foxsay}:${POSTGRES_PASSWORD:-foxsay_dev}@postgres:5432/${POSTGRES_DB:-foxsay}
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-foxsay}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-foxsay_dev_password}
      S3_BUCKET: ${MINIO_BUCKET:-foxsay-content}
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  minio_data:
